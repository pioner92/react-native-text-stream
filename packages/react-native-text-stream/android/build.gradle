// The C++ (cpp/ and src/main/jni) is built by the app through autolinking (react-native.config.js),
// so this module holds only the Kotlin view.
buildscript {
  repositories {
    google()
    mavenCentral()
  }
}

apply plugin: 'com.android.library'
if (project.extensions.findByName('kotlin') == null) {
  apply plugin: 'kotlin-android'
}

def getExtOrDefault(name, defaultValue) {
  return rootProject.ext.has(name) ? rootProject.ext.get(name) : defaultValue
}

// Test and benchmark hooks (StreamTextDebug): only the example app turns them on, with
// `streamTextTesting=true` in its gradle.properties; STREAMTEXT_TESTING=0 turns them off, as on iOS.
def streamTextTesting = rootProject.findProperty('streamTextTesting') == 'true' && System.getenv('STREAMTEXT_TESTING') != '0'

android {
  namespace 'com.textstream'
  compileSdkVersion getExtOrDefault('compileSdkVersion', 36)

  defaultConfig {
    minSdkVersion getExtOrDefault('minSdkVersion', 24)
    targetSdkVersion getExtOrDefault('targetSdkVersion', 36)
    buildConfigField 'boolean', 'STREAMTEXT_TESTING', streamTextTesting.toString()
  }

  buildFeatures {
    buildConfig true
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }

  kotlinOptions {
    jvmTarget = '17'
  }
}

repositories {
  google()
  mavenCentral()
}

dependencies {
  implementation 'com.facebook.react:react-android'
  testImplementation 'junit:junit:4.13.2'
}
