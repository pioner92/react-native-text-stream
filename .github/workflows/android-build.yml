name: Build Android

permissions:
  contents: read

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/android-build.yml'
      - 'package.json'
      - 'bun.lock'
      - 'patches/**'
      - 'scripts/**'
      - 'packages/react-native-text-stream/**'
      - 'packages/react-native-nitro-fetch/**'
      - 'example/package.json'
      - 'example/react-native.config.js'
      - 'example/android/**'
      - 'example/__tests__/**'
      - 'example/*harness*'
      - 'server/**'
      - 'tests/native/**'
  pull_request:
    paths:
      - '.github/workflows/android-build.yml'
      - 'package.json'
      - 'bun.lock'
      - 'patches/**'
      - 'scripts/**'
      - 'packages/react-native-text-stream/**'
      - 'packages/react-native-nitro-fetch/**'
      - 'example/package.json'
      - 'example/react-native.config.js'
      - 'example/android/**'
      - 'example/__tests__/**'
      - 'example/*harness*'
      - 'server/**'
      - 'tests/native/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android Example App
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies (bun)
        run: bun install --frozen-lockfile

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('example/android/**/*.gradle*') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Run Gradle build
        working-directory: example/android
        run: ./gradlew :react-native-text-stream:testDebugUnitTest assembleDebug --no-daemon --build-cache

      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: streamFetch in-app regressions
        uses: reactivecircus/android-emulator-runner@v2
        env:
          HARNESS_ANDROID_AVD: stream-fetch-ci
          HARNESS_APP_PATH: ${{ github.workspace }}/example/android/app/build/outputs/apk/debug/app-debug.apk
        with:
          api-level: 35
          arch: x86_64
          avd-name: stream-fetch-ci
          disable-animations: true
          script: bash scripts/test-stream-fetch-harness.sh android

      - name: Stop Gradle daemon
        if: always()
        working-directory: example/android
        run: ./gradlew --stop
