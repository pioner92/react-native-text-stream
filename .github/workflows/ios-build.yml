name: Build iOS

permissions:
  contents: read

on:
  push:
    branches:
      - master
    paths:
      - '.github/workflows/ios-build.yml'
      - 'package.json'
      - 'bun.lock'
      - 'patches/**'
      - 'scripts/**'
      - 'packages/react-native-text-stream/**'
      - 'example/package.json'
      - 'example/App.tsx'
      - 'example/src/**'
      - 'example/react-native.config.js'
      - 'example/ios/**'
      - 'example/modules/**'
      - 'example/Gemfile'
      - 'example/Gemfile.lock'
      - 'example/__tests__/**'
      - 'example/*harness*'
      - 'server/**'
      - 'tests/native/**'
  pull_request:
    paths:
      - '.github/workflows/ios-build.yml'
      - 'package.json'
      - 'bun.lock'
      - 'patches/**'
      - 'scripts/**'
      - 'packages/react-native-text-stream/**'
      - 'example/package.json'
      - 'example/App.tsx'
      - 'example/src/**'
      - 'example/react-native.config.js'
      - 'example/ios/**'
      - 'example/modules/**'
      - 'example/Gemfile'
      - 'example/Gemfile.lock'
      - 'example/__tests__/**'
      - 'example/*harness*'
      - 'server/**'
      - 'tests/native/**'
  workflow_dispatch:

env:
  USE_CCACHE: 1

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build iOS Example App
    runs-on: macOS-15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install dependencies (bun)
        run: bun install --frozen-lockfile

      - name: Native streamFetch invariants (ASan and UBSan)
        run: bun run test:native

      - name: Draw cancellation token (Thread Sanitizer)
        run: sh scripts/test-draw-token-tsan.sh

      - name: Setup Ruby (bundle)
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
          working-directory: example/ios

      - name: Install xcpretty
        run: gem install xcpretty

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: |
            ~/.cocoapods/repos
            example/ios/Pods
          key: ${{ runner.os }}-pods-${{ hashFiles('example/ios/Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-pods-

      - name: Install Pods
        working-directory: example/ios
        run: pod install

      - name: Build App
        working-directory: example/ios
        run: |
          set -o pipefail && xcodebuild \
            CC=clang CPLUSPLUS=clang++ LD=clang LDPLUSPLUS=clang++ \
            -derivedDataPath build -UseModernBuildSystem=YES \
            -workspace TextStreamExample.xcworkspace \
            -scheme TextStreamExample \
            -sdk iphonesimulator \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            build \
            CODE_SIGNING_ALLOWED=NO | xcpretty

      - name: Select installed iPhone simulator
        run: |
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process';
          import { appendFileSync } from 'node:fs';
          const { devices } = JSON.parse(execFileSync('xcrun', ['simctl', 'list', 'devices', 'available', '-j']));
          for (const [runtime, list] of Object.entries(devices)) {
            const device = list.find((d) => d.name.startsWith('iPhone'));
            if (!runtime.includes('.iOS-') || !device) continue;
            appendFileSync(process.env.GITHUB_ENV, `HARNESS_IOS_DEVICE=${device.name}\nHARNESS_IOS_VERSION=${runtime.split('.iOS-')[1].replaceAll('-', '.')}\n`);
            process.exit(0);
          }
          throw new Error('No available iPhone simulator');
          NODE

      - name: Fetch, renderer and lifecycle in-app regressions
        env:
          HARNESS_APP_PATH: ${{ github.workspace }}/example/ios/build/Build/Products/Debug-iphonesimulator/TextStreamExample.app
        run: bash scripts/test-stream-fetch-harness.sh ios all

      - name: Upload native test results and platform skips
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-native-regressions
          path: |
            ${{ runner.temp }}/streamtext-harness-ios
          if-no-files-found: warn
