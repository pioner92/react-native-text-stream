name: Checks

permissions:
  contents: read

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  js:
    name: Typecheck, build and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      # These suites use node:test. Bun does not run its Node test runner.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Cache bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies (bun)
        run: bun install --frozen-lockfile

      # Typechecks the package (build config) and its tests, then builds lib/.
      - name: Build the package
        run: bun run build

      - name: Package unit tests
        run: bun run test

      - name: Fixture server and scroll-follow tests
        run: bun run test:fixtures

      - name: Native streamFetch invariants (ASan and UBSan)
        run: bun run test:native

      - name: Native Markdown parser and patch seams (ASan and UBSan)
        run: sh scripts/test-markdown-native.sh --sanitize

      - name: Native SSE and NDJSON parser seams (ASan and UBSan)
        run: sh scripts/test-response-parser-native.sh --sanitize

      - name: Example unit tests
        run: bun run --cwd example test

      - name: Example and in-app test types
        run: bun x --no-install tsc --noEmit --project example/tsconfig.json --ignoreDeprecations 6.0
