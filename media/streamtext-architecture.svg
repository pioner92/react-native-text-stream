<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="250" viewBox="0 0 1100 250" role="img" aria-labelledby="title description">
  <title id="title">StreamText architecture</title>
  <desc id="description">JavaScript describes a request once. Your endpoint streams through streamFetch using URLSession or OkHttp into a native buffer, then StreamText performs native text rendering and layout.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6d5b91"/>
    </marker>
  </defs>
  <rect width="1100" height="250" rx="16" fill="#faf8ff"/>
  <g fill="#f0eaff" stroke="#8b73b4" stroke-width="1.5">
    <rect x="25" y="145" width="220" height="80" rx="12"/>
    <rect x="300" y="145" width="220" height="80" rx="12"/>
    <rect x="575" y="145" width="220" height="80" rx="12"/>
    <rect x="850" y="145" width="220" height="80" rx="12"/>
    <rect x="300" y="20" width="220" height="50" rx="12"/>
  </g>
  <g stroke="#6d5b91" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <path d="M245 185 H294"/>
    <path d="M520 185 H569"/>
    <path d="M795 185 H844"/>
    <path d="M410 70 V139" stroke-dasharray="5 5"/>
  </g>
  <g fill="#312044" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="middle" font-size="19">
    <text x="135" y="192">Your endpoint</text>
    <text x="410" y="178" font-weight="600">streamFetch</text>
    <text x="410" y="204" font-size="16">URLSession / OkHttp</text>
    <text x="685" y="192">Native buffer</text>
    <text x="960" y="178" font-weight="600">StreamText</text>
    <text x="960" y="204" font-size="16">Native text + layout</text>
    <text x="410" y="52">JavaScript</text>
    <text x="430" y="111" text-anchor="start" font-size="16">Describe the request once</text>
  </g>
</svg>
